name: Project website and launcher manifest
on:
  push:
    branches: [main]
  release:
    types: [published, edited, released, unpublished, deleted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check distribution integrity and failure paths
        run: python3 -m unittest discover -s tests -v
      - name: Check platform selection and download states
        run: node tests/frontend.mjs
      - name: Assemble website and verify configured downloads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/distribution.py build --output dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
